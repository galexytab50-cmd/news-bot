name: IRAF Monitoring Pipeline

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Prevents two runs from processing the same Inoreader batch at the same
# time (Race Condition protection, item #8 in the spec). Runs queue up
# instead of overlapping; none are cancelled, so no article is skipped.
concurrency:
  group: iraf-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          INOREADER_APP_ID: ${{ secrets.INOREADER_APP_ID }}
          INOREADER_APP_KEY: ${{ secrets.INOREADER_APP_KEY }}
          INOREADER_EMAIL: ${{ secrets.INOREADER_EMAIL }}
          INOREADER_PASSWORD: ${{ secrets.INOREADER_PASSWORD }}
          INOREADER_TAG: ${{ secrets.INOREADER_TAG }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python main.py

      # if: always() -- runs even if the pipeline step above failed/crashed
      # partway through, so any articles that were already published and
      # written to disk before the crash are NOT lost/re-published later.
      - name: Commit updated duplicate store and reports
        if: always()
        run: |
          git config user.name "iraf-bot"
          git config user.email "iraf-bot@users.noreply.github.com"
          git add published_articles.jsonl reports/ || true
          git diff --staged --quiet || git commit -m "Update duplicate store and reports [skip ci]"
          git pull --rebase --autostash || true
          git push || true
